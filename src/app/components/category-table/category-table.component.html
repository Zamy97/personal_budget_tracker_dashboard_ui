<div class="glass-card sheet-card fade-in-up">
  <div class="sheet-card__header" [style.--accent]="'var(' + config().color + ')'">
    <div class="sheet-card__title">
      <lucide-icon [name]="config().icon" [size]="16"></lucide-icon>
      {{ config().label }}
    </div>
    <button class="sheet-card__add" (click)="addRow()" title="Add row">
      <lucide-icon name="plus" [size]="14"></lucide-icon>
    </button>
  </div>

  <div class="sheet-table">
    <div class="sheet-row sheet-row--head">
      <span>Category</span>
      <span class="num">Total</span>
      <span></span>
    </div>

    <div class="sheet-row" *ngFor="let row of rows()">
      <app-editable-cell
        [value]="row.name"
        type="text"
        (valueChange)="onNameChange(row.id, $event)"
      ></app-editable-cell>
      <button class="amount-button" (click)="openDetails(row)" title="Add or edit dated entries">
        {{ row.actual | currency }}
      </button>
      <div class="row-actions">
        <button
          class="row-action"
          [class.row-action--active]="row.recurring"
          (click)="toggleRecurring(row.id)"
          [title]="row.recurring ? 'Carries into new months' : 'Does not carry into new months'"
        >
          <lucide-icon name="repeat-2" [size]="12"></lucide-icon>
        </button>
        <button class="row-delete" (click)="deleteRow(row.id)" [title]="'Remove from ' + monthLabel() + ' only'">
          <lucide-icon name="x" [size]="13"></lucide-icon>
        </button>
      </div>
    </div>

    <div class="sheet-row sheet-row--total">
      <span>TOTAL</span>
      <span class="num">{{ total().actual | currency }}</span>
      <span></span>
    </div>
  </div>
</div>

<app-line-item-editor
  *ngIf="selectedRow() as row"
  [categoryId]="row.id"
  [categoryName]="row.name"
  (closed)="selectedRow.set(null)"
></app-line-item-editor>
